name: Security P0

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-matrix:
    name: test-matrix (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package from CI-proven constraints
        run: python -m pip install -c .github/constraints/ci-proven-20261002.txt '.[mcp]'
      - name: Dependency consistency
        run: python -m pip check
      - name: Compile check
        run: python -m compileall -q src tests
      - name: Secret hygiene
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          patterns = [
              re.compile(r"sk-[A-Za-z0-9_-]{20,}"),
              re.compile(r"gh[pousr]_[A-Za-z0-9]{30,}"),
              re.compile(r"github_pat_[A-Za-z0-9_]{40,}"),
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
          ]
          findings = []
          for path in pathlib.Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              for line_no, line in enumerate(text.splitlines(), 1):
                  if any(pattern.search(line) for pattern in patterns):
                      findings.append(f"{path}:{line_no}")
          if findings:
              print("secret hygiene findings:")
              print("\n".join(findings))
              sys.exit(1)
          PY
      - name: Run test suite
        run: python -m unittest discover -s tests -v

  test:
    name: test
    needs: test-matrix
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Preserve required branch-protection context
        env:
          MATRIX_RESULT: ${{ needs.test-matrix.result }}
        run: |
          test "$MATRIX_RESULT" = "success"
