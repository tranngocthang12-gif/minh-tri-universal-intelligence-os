name: Security P0

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-matrix:
    name: test-matrix (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package from CI-proven constraints
        run: python -m pip install -c .github/constraints/ci-proven-20261002.txt '.[mcp]'
      - name: Dependency consistency
        run: python -m pip check
      - name: Compile check
        run: python -m compileall -q src tests
      - name: Secret hygiene
        run: python -m unittest tests.test_secret_hygiene -v
      - name: Run test suite
        run: python -m unittest discover -s tests -v

  powershell-parse:
    name: powershell-parse
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse Windows PowerShell scripts
        shell: pwsh
        run: |
          $parseFailed = $false
          Get-ChildItem -Path ops/windows -Filter *.ps1 -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $parseFailed = $true
              $messages = ($errors | ForEach-Object { $_.Message }) -join '; '
              Write-Error ("PowerShell parse failure in {0}: {1}" -f $_.FullName, $messages)
            }
          }
          if ($parseFailed) { exit 1 }

  security-audit:
    name: security-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Reachable Git history secret scan
        run: python tools/history_secret_scan.py
      - name: Install package and vulnerability auditor
        run: |
          python -m pip install -c .github/constraints/ci-proven-20261002.txt '.[mcp]'
          python -m pip install 'pip-audit==2.10.1'
      - name: Dependency vulnerability audit
        run: python -m pip_audit --local

  realtime-lease-proof:
    name: realtime-lease-proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -c .github/constraints/ci-proven-20261002.txt .
      - name: Real-clock 60 second lease expiry proof
        run: python tests/realtime_lease_probe.py

  test:
    name: test
    needs: [test-matrix, powershell-parse, security-audit, realtime-lease-proof]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Preserve required branch-protection context
        env:
          MATRIX_RESULT: ${{ needs.test-matrix.result }}
          POWERSHELL_RESULT: ${{ needs.powershell-parse.result }}
          SECURITY_AUDIT_RESULT: ${{ needs.security-audit.result }}
          REALTIME_LEASE_RESULT: ${{ needs.realtime-lease-proof.result }}
        run: |
          test "$MATRIX_RESULT" = "success"
          test "$POWERSHELL_RESULT" = "success"
          test "$SECURITY_AUDIT_RESULT" = "success"
          test "$REALTIME_LEASE_RESULT" = "success"
